server.port=8085

spring.application.name=ai-microservice
spring.web.cors.allowed-origins=*
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Python AI base URL (used by DuplicateDetectionService and PythonAnalyzeService)
python.ai.url=${PYTHON_AI_URL:http://localhost:9000}
python.analyze.url=${PYTHON_ANALYZE_URL:http://localhost:8000/analyze}

# Dedicated endpoints (each overridable via environment variable)
python.compare-accord.url=${PYTHON_COMPARE_ACCORD_URL:http://localhost:8000/compare-accord-form}
python.analyze-full.url=${PYTHON_ANALYZE_FULL_URL:http://localhost:8000/analyze-full}
python.check-accord-duplicate.url=${PYTHON_CHECK_ACCORD_DUPLICATE_URL:http://localhost:9000/check-duplicate-accord}

# Upload directory (override with UPLOADS_DIR)
uploads.dir=${UPLOADS_DIR:/app/uploads}

# Embedding service
embedding.service.url=${EMBEDDING_SERVICE_URL:http://localhost:9000/embedding}

# Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Tesseract OCR
tesseract.datapath=${TESSERACT_DATAPATH:/usr/share/tesseract-ocr/5/tessdata}
tesseract.language=${TESSERACT_LANGUAGE:eng}

# Headless mode
java.awt.headless=true

# Logging
logging.level.com.coralio.ai_microservice=DEBUG