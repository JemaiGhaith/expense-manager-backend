spring:
  application:
    name: USER-MICROSERVICE  # Must be UPPERCASE to match gateway
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  web:
    resources:
      static-locations: file:./uploads/,classpath:/static/
  datasource:
    url: jdbc:postgresql://localhost:5432/expense_app
    username: postgres
    password: 112004
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

server:
  port: 8083

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    hostname: localhost
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

management:
  endpoints:
    web:
      exposure:
        include: '*'

file:
  upload-dir: ./uploads

logging:
  level:
    com.netflix.discovery: DEBUG  # Add this for Eureka debugging
    org.springframework.cloud.netflix: DEBUG