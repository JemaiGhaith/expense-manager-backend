<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${notification.title}">Payment Processed</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .header {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 28px;
        }
        .header .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .content {
            padding: 30px;
        }
        .transaction-details {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #28a745;
        }
        .button {
            display: inline-block;
            padding: 12px 30px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            margin: 20px 0;
            font-weight: 600;
            text-align: center;
        }
        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            border-top: 1px solid #dee2e6;
            font-size: 12px;
            color: #6c757d;
        }
        @media only screen and (max-width: 600px) {
            .container { width: 100% !important; margin: 0 !important; }
            .content { padding: 20px !important; }
            .button { display: block !important; width: 100% !important; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="icon">💳</div>
        <h1 th:text="${notification.title}">Payment Processed</h1>
        <p th:if="${formattedDate}" th:text="'Date: ' + ${formattedDate}" style="margin-top: 10px; opacity: 0.9;"></p>
    </div>

    <div class="content">
        <p>Bonjour,</p>
        <p th:text="${notification.message}">Your payment has been processed.</p>

        <div class="transaction-details" th:if="${notification.data}">
            <h3 style="margin-top: 0;">💳 Détails de la transaction</h3>
            <table>
                <tr>
                    <td>Référence :</td>
                    <td><strong th:text="${notification.data.transactionReference}">TRX-2024-001</strong></td>
                </tr>
                <tr>
                    <td>Montant :</td>
                    <td><strong th:text="${notification.data.amount} + ' €'">250.00 €</strong></td>
                </tr>
                <tr>
                    <td>Date de traitement :</td>
                    <td th:text="${notification.data.processedDate}">2024-03-26</td>
                </tr>
            </table>
        </div>

        <div style="text-align: center;">
            <a th:href="${frontendUrl + notification.data.detailsUrl}" class="button" th:text="${buttonText}">Voir la transaction</a>
        </div>
    </div>

    <div class="footer">
        <p>© <span th:text="${currentYear}">2024</span> <span th:text="${companyName}">Coral-io</span>. Tous droits réservés.</p>
        <p>Cet email a été envoyé automatiquement, merci de ne pas y répondre.</p>
    </div>
</div>
</body>
</html>
