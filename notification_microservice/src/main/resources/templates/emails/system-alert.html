<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${notification.title}">System Alert</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .header {
            background: linear-gradient(135deg, #fd7e14 0%, #ffc107 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 28px;
        }
        .header .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .content {
            padding: 30px;
        }
        .warning-box {
            background: #fff3cd;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border: 1px solid #ffeeba;
            color: #856404;
        }
        .button {
            display: inline-block;
            padding: 12px 30px;
            background-color: #fd7e14;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            margin: 20px 0;
            font-weight: 600;
            text-align: center;
        }
        .info-box {
            background: #e8f4fd;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border: 1px solid #b8daff;
        }
        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            border-top: 1px solid #dee2e6;
            font-size: 12px;
            color: #6c757d;
        }
        @media only screen and (max-width: 600px) {
            .container { width: 100% !important; margin: 0 !important; }
            .content { padding: 20px !important; }
            .button { display: block !important; width: 100% !important; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="icon">⚠️</div>
        <h1 th:text="${notification.title}">System Alert</h1>
        <p th:if="${formattedDate}" th:text="'Date: ' + ${formattedDate}" style="margin-top: 10px; opacity: 0.9;"></p>
    </div>

    <div class="content">
        <p>Bonjour,</p>
        <p th:text="${notification.message}">This is a system alert message.</p>

        <!-- SAFE: Check if data exists and has reason field before accessing -->
        <div th:if="${notification.data != null and notification.data.containsKey('reason')}" class="warning-box">
            <strong>⚠️ Détails :</strong>
            <p th:text="${notification.data.get('reason')}" style="margin: 10px 0 0 0;"></p>
        </div>

        <!-- Display other data if available -->
        <div th:if="${notification.data != null and notification.data.size() > 0 and !notification.data.containsKey('reason')}" class="info-box">
            <strong>📌 Informations supplémentaires :</strong>
            <ul style="margin: 10px 0 0 20px;">
                <li th:each="entry : ${notification.data}">
                    <strong th:text="${entry.key} + ':'"></strong> <span th:text="${entry.value}"></span>
                </li>
            </ul>
        </div>

        <div style="text-align: center;">
            <a th:href="${frontendUrl}" class="button" th:text="${buttonText}">En savoir plus</a>
        </div>
    </div>

    <div class="footer">
        <p>© <span th:text="${currentYear}">2024</span> <span th:text="${companyName}">Coral-io</span>. Tous droits réservés.</p>
        <p>Cet email a été envoyé automatiquement, merci de ne pas y répondre.</p>
    </div>
</div>
</body>
</html>
