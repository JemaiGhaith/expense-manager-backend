server:
  port: 8888

spring:
  application:
    name: gatewayserver

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8090/realms/master/protocol/openid-connect/certs

  cloud:
    config:
      enabled: false

    discovery:
      enabled: true

    gateway:
      discovery:
        locator:
          enabled: false   # 🔴 IMPORTANT
      routes:
        - id: auth-ms
          uri: lb://auth_microservice
          predicates:
            - Path=/api/auth/**

        - id: expense-ms
          uri: lb://expense_management_microservice
          predicates:
            - Path=/api/expenses/**
          filters:
            - StripPrefix=1

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
