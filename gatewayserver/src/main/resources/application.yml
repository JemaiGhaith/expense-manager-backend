server:
  port: 8888
  # ✅ Remove all timeouts at server level
  tomcat:
    connection-timeout: -1
    keep-alive-timeout: -1
    max-keep-alive-requests: -1

spring:
  application:
    name: gatewayserver

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8090/realms/coral-io_realm

  cloud:
    config:
      enabled: false

    gateway:
      discovery:
        locator:
          enabled: false

      # ✅ Global HTTP client configuration - NO TIMEOUTS
      httpclient:
        connect-timeout: -1
        response-timeout: -1
        pool:
          type: ELASTIC
          max-idle-time: -1
          acquire-timeout: -1

      # ✅ Netty configuration - NO TIMEOUTS
      netty:
        connect-timeout: -1
        read-timeout: -1
        write-timeout: -1

      routes:
        - id: expense-ms
          uri: lb://EXPENSE-MANAGEMENT-MICROSERVICE
          predicates:
            - Path=/api/expenses/**, /api/categories/**, /api/projects/**, /api/admin/**, /api/departments/**
          filters:
            - name: CircuitBreaker
              args:
                name: expenseService
                fallbackUri: forward:/fallback/expense

        - id: user-ms
          uri: lb://USER-MICROSERVICE
          predicates:
            - Path=/api/users/**, /api/profile/**
          filters:
            - name: CircuitBreaker
              args:
                name: userService
                fallbackUri: forward:/fallback/user

        - id: ai-ms
          uri: lb://AI-MICROSERVICE
          predicates:
            - Path=/api/ai/**
          filters:
            - name: CircuitBreaker
              args:
                name: aiService
                fallbackUri: forward:/fallback/ai

        - id: chatbot-ms
          uri: lb://CHATBOT-MICROSERVICE
          predicates:
            - Path=/api/chatbot/**, /ws-chatbot/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: chatbotService
                fallbackUri: forward:/fallback/chatbot
          metadata:
            response-timeout: -1
            connect-timeout: -1

# ✅ Eureka client timeouts - increase to very high values
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
    eureka-server-connect-timeout-seconds: 60
    eureka-server-read-timeout-seconds: 60
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

# ✅ Resilience4j configuration - NO TIMEOUTS
resilience4j:
  circuitbreaker:
    instances:
      expenseService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 30000
        failureRateThreshold: 50
        slowCallDurationThreshold: 600000
        slowCallRateThreshold: 100
      userService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 30000
      aiService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 3
        waitDurationInOpenState: 30000
      chatbotService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 30000
        failureRateThreshold: 50
        slowCallDurationThreshold: 600000
        slowCallRateThreshold: 100
  timelimiter:
    instances:
      expenseService:
        timeoutDuration: 600000
      userService:
        timeoutDuration: 600000
      aiService:
        timeoutDuration: 600000
      chatbotService:
        timeoutDuration: 3600000  # 1 hour
  retry:
    instances:
      expenseService:
        maxAttempts: 1
      userService:
        maxAttempts: 1
      aiService:
        maxAttempts: 1
      chatbotService:
        maxAttempts: 1

logging:
  level:
    com.netflix.eureka: DEBUG
    com.netflix.discovery: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.reactive: DEBUG
    reactor.netty: DEBUG